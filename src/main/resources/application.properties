spring.application.name=culinario

# JWT Configuration
app.jwt.secret=SuperTajnyKluczDoPodpisywaniaTokenowJWTKtoryJestBardzoDlugi
app.jwt.expiration-in-ms=86400000

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:culinariodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate ddl-auto: update (tworzy/aktualizuje tabele automatycznie)
spring.jpa.hibernate.ddl-auto=update

# H2 Console (dost?pna pod /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
